# 로컬 개발용. `--spring.profiles.active=local`
#
# 스키마와 공통코드는 기본 프로파일과 똑같이 Flyway가 만든다 (V1 · V2 · V3).
# 여기서는 접속 정보와 로그 레벨만 덮어쓴다 — 스키마 생성 경로를 하나로 유지하기 위해서다 (DR-D01).
#
# 샘플 콘텐츠가 필요하면 deploy/seed-local.sql을 손으로 한 번 넣는다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dcsp
    username: dwas
    password: dcspapp
logging:
  level:
    kr.co.csp: DEBUG
    org.hibernate.SQL: DEBUG
