# 단일 서버 · Nginx 앞단 (기술 스택 확정 사항)
#
# web(정적 빌드)과 was(Spring Boot)를 같은 오리진으로 묶는다.
# 오리진이 같으면 관리자 세션 쿠키(R-55)가 그대로 붙고 CORS 설정이 필요 없다.

upstream csp_was {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    # 업로드 도면 크기. application.yml의 max-file-size와 맞춘다.
    client_max_body_size 12m;

    # ------------------------------------------------------------------
    # DR-S01 — 요청자 IP
    #
    # 이 헤더가 없으면 WAS의 getRemoteAddr()가 항상 Nginx의 IP를 돌려준다.
    # 그 값으로 일일 제한(R-46)을 걸면 모든 사용자가 한 사람으로 집계되어
    # 제한이 무력화된다.
    #
    # WAS 쪽은 server.forward-headers-strategy=native와
    # server.tomcat.remoteip.internal-proxies가 짝을 이룬다. 신뢰 프록시를
    # 지정하지 않으면 외부에서 X-Forwarded-For를 위조해 우회할 수 있다.
    # ------------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 사용자 API
    location /api/ {
        proxy_pass http://csp_was;
    }

    # 관리자 API.
    #
    # 숨김 경로가 아니다. 숨김 URL은 부가 조치일 뿐이며 실제 방어선은
    # WAS의 AdminAuthInterceptor다 (R-20 · R-49). 여기서 IP 화이트리스트를
    # 걸 수는 있지만, 그것도 인증을 대신하지는 못한다.
    location /admin/api/ {
        proxy_pass http://csp_was;
    }

    # 도면 파일. 파일명이 file_uuid라 내용이 바뀌면 URL도 바뀐다.
    # WAS가 immutable 캐시 헤더를 붙이므로 여기서 다시 정하지 않는다 (DR-F02).
    location /api/drawings/ {
        proxy_pass http://csp_was;
    }

    # ------------------------------------------------------------------
    # web — frontend/dist
    #
    # SPA라 서버가 모르는 경로도 index.html로 보내야 한다. /admin 같은
    # 클라이언트 라우트가 404가 되지 않도록 try_files로 흘린다.
    # ------------------------------------------------------------------
    root /var/www/csp;
    index index.html;

    # 해시가 붙은 번들은 내용이 바뀌면 이름도 바뀐다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 웹폰트. OFL 고지는 서비스 정보 페이지에 있다 (DR-P08 · DR-X01).
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
